[pytest]
markers =
    smoke: fast sanity checks that core modules/endpoints are alive
    regression: existing behaviour that must not break (auto-applied to test_agent.py)
    functional: proves each feature works correctly, incl. via real HTTP endpoints
    monkey: randomized / fuzz input testing
    performance: response time, latency comparison, concurrent request handling
    accuracy: booking success rate, scheduling accuracy, AI extraction accuracy,
              scheduling agent evaluation, vaccine dependency validation evaluation
